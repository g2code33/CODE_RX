# Cloudflare Workers Configuration for CODE Rx SOCIETY
# This file configures your backend API, database, and storage

name = "coderxsociety-api"
main = "functions/[[path]].ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]


# D1 Database (Structured Data)
[[d1_databases]]
binding = "DB"
database_name = "code-rx-db"
database_id = "2fa4bfb7-2b63-4cb3-8ae2-2b2644711b32"

# R2 Storage (Files & Images)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "code-rx-storage"

# Environment Variables
# JWT_SECRET and ADMIN_PASSWORD are deliberately NOT stored in this repository.
# Configure them as encrypted Cloudflare Pages/Worker secrets before a fresh
# production deployment. PHANTOM_EMAIL defaults to ADMIN_EMAIL when omitted.
[vars]
ADMIN_EMAIL = "coderxsociety@gmail.com"
PHANTOM_EMAIL = "coderxsociety@gmail.com"
TELEGRAM_LINK = "https://t.me/+EdRpfR1GTGNjM2Q0"
# SITE_URL = "https://coderxsociety.pages.dev"

# EmailJS (optional) — enables email notifications for new applications,
# contact messages, and application approvals. Leave empty to disable.
# Create templates and credentials at https://www.emailjs.com
EMAILJS_PUBLIC_KEY = ""
EMAILJS_SERVICE_ID = ""
EMAILJS_TEMPLATE_ID_JOIN = ""
EMAILJS_TEMPLATE_ID_CONTACT = ""
EMAILJS_TEMPLATE_ID_APPROVAL = ""
EMAILJS_TEMPLATE_ID_RESET = ""
EMAILJS_TEMPLATE_ID_ACTIVATION = ""

# Development environment
[env.dev]
name = "code-rx-api-dev"

# Production environment
[env.production]
name = "code-rx-api-prod"
